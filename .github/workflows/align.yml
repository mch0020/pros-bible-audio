name: Verse timings for Louis Tyler's readings
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs: { jobs: '${{ steps.j.outputs.jobs }}' }
    steps:
      - uses: actions/checkout@v4
      - id: j
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          # Only the parts whose zip is already in the staging release.
          gh release view staging -R ${{ github.repository }} --json assets -q '[.assets[].name]' > have.json
          echo "jobs=$(jq -c --slurpfile h have.json '[.[] | select(.asset | ltrimstr("*") | rtrimstr("*") as $k | any($h[0][]; contains($k)))]' jobs.json)" >> $GITHUB_OUTPUT
      - env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          for t in tyler-ot tyler-tr tyler-wh; do
            gh release view $t -R ${{ github.repository }} >/dev/null 2>&1 || gh release create $t -R ${{ github.repository }} --title "$t" --notes "Louis Tyler's readings (hebgkaudiobible.com), used with his permission. One file per chapter, mono 48 kbps."
          done
  align:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: { job: '${{ fromJson(needs.plan.outputs.jobs) }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: sudo apt-get install -y ffmpeg >/dev/null && pip install -q torch==2.5.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - env: { GH_TOKEN: '${{ github.token }}' }
        run: mkdir -p /tmp/z && cd /tmp/z && gh release download staging -R ${{ github.repository }} -p "${{ matrix.job.asset }}" -D parts && cat parts/* > a.zip && rm -r parts && unzip -q a.zip && rm a.zip
      - run: python tools/align_book.py ${{ matrix.job.corpus }} /tmp/z out "${{ matrix.job.books }}"
      - env: { GH_TOKEN: '${{ github.token }}' }
        run: ls out/*.mp3 >/dev/null 2>&1 && gh release upload tyler-${{ matrix.job.corpus }} out/*.mp3 --clobber -R ${{ github.repository }} || echo "no mp3"
      - run: mkdir -p t/${{ matrix.job.corpus }} && cp out/*.json t/${{ matrix.job.corpus }}/ || true
      - uses: actions/upload-artifact@v4
        with: { name: 't-${{ matrix.job.name }}', path: t, retention-days: 30 }
  collect:
    needs: align
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dl, pattern: 't-*', merge-multiple: true }
      - run: |
          mkdir -p timings
          cp -r dl/* timings/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add timings && git commit -m "Verse timings" && git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} || echo nothing
